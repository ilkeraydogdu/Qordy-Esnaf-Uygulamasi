name: Build and Release QORDY Esnaf POS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS Binary (Release)
        run: cargo build --release

      - name: Package macOS Binary
        run: |
          mkdir -p package_mac
          cp target/release/qordy_pos_rs package_mac/qordy-pos-mac
          tar -czvf qordy-pos-macos-universal.tar.gz -C package_mac qordy-pos-mac

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qordy-pos-macos
          path: qordy-pos-macos-universal.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Binary (Release)
        run: cargo build --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qordy-pos-windows
          path: target/release/qordy_pos_rs.exe
